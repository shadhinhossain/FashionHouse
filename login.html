<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>FashionHouse | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <header>
        <div class="container nav">
            <div class="logo">Fashion<span>House</span></div>
            <nav><a href="index.html">Home</a><a href="about.html">About</a><a href="products.html">Products</a><a
                    href="gallery.html">Gallery</a></nav>
        </div>
    </header>
    <div class="page-title">
        <h1>Login</h1>
        <p>Welcome back to FashionHouse</p>
    </div>
    <form class="form" action="#" method="post">
        <h2>Member Login</h2>
        <div class="field"><label for="email">Email Address</label><input type="email" id="email" name="email"
                placeholder="Enter your email" required></div>
        <div class="field"><label for="password">Password</label><input type="password" id="password" name="password"
                placeholder="Enter your password" required></div>
        <div class="field"><label><input type="checkbox" name="remember"> Remember me</label></div>
        <div class="actions"><button class="btn" type="submit">Login</button><button class="btn reset"
                type="reset">Reset</button></div>
        <p style="text-align:center;margin-top:18px">Don't have an account? <a href="signup.html"
                style="color:#e67e22">Sign Up</a></p>
    </form>
    <footer>
        <div class="logo">Fashion<span>House</span></div>
        <p>© 2026 FashionHouse</p>
        <div class="social-icons">
            <a href="https://www.facebook.com" target="_blank"> <i class="fa-brands fa-facebook-f"></i> </a>
            <a href="https://www.instagram.com" target="_blank"> <i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.youtube.com" target="_blank"> <i class="fa-brands fa-youtube"></i> </a>
        </div>
    </footer>
</body>

</html>
